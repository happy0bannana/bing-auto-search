<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 240px; padding: 14px; font-family: system-ui, sans-serif; background: #111; color: #eee; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  button { width: 100%; padding: 9px; border: 0; border-radius: 8px; font-size: 14px; cursor: pointer; background: #0a84ff; color: #fff; }
  button.stop { background: #e5484d; }
  #status { margin: 10px 0; font-size: 13px; }
  .bar { height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #30d158; transition: width .3s; }
  label { display: block; margin-top: 10px; font-size: 12px; color: #aaa; }
</style>
</head>
<body>
  <h1>Auto Búsquedas Bing</h1>
  <div id="status">Listo</div>
  <div class="bar"><div id="fill"></div></div>
  <br>
  <button id="btn">Iniciar</button>
  <label><input type="checkbox" id="auto"> Iniciar al abrir Edge</label>
  <script src="popup.js"></script>
</body>
</html>
